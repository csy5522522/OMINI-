server {
    listen 80;
    server_name omini.xin;
    location /.well-known/acme-challenge/ { root /var/www/omini-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name omini.xin;
    ssl_certificate /etc/letsencrypt/live/omini.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omini.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /api/chat/stream {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 310s;
    }
    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

