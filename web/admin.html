<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omini 管理员后台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/timetable-ai.css"><script src="/appearance.js" defer></script><script src="/admin.js" defer></script><script src="/admin-timetable-ai.js" defer></script></head><body><main class="admin-shell"><a href="/">← 返回工具箱</a><h1>管理员后台</h1><p class="muted">公告发布与管理 · 账号管理</p><form id="admin-login" class="card admin-login"><label for="admin-name">管理员账号</label><input id="admin-name" autocomplete="username" value="admin" required><label for="admin-password">密码</label><input id="admin-password" type="password" autocomplete="current-password" required><button class="button primary">登录后台</button></form><p id="admin-status" role="status"></p><section id="admin-panel" hidden><div class="memo-toolbar"><button class="button" id="admin-reload">刷新账号</button><button class="button" id="admin-change">修改管理员密码</button><button class="button" id="admin-logout">退出登录</button></div><section class="card admin-announcements" aria-labelledby="announcement-management-title">
<h2 id="announcement-management-title">公告管理</h2><p class="muted">发布后，所有访客都可以在网站查看。</p>
<form id="announcement-form"><input id="announcement-id" type="hidden"><input id="announcement-version" type="hidden">
<label for="announcement-title">公告标题</label><input id="announcement-title" maxlength="120" required placeholder="填写公告标题">
<label for="announcement-content">公告正文</label><textarea id="announcement-content" maxlength="20000" rows="6" required placeholder="填写公告内容，支持换行"></textarea>
<div class="announcement-actions"><button class="button primary" id="announcement-save" type="submit">发布公告</button><button class="button" id="announcement-cancel" type="button" hidden>取消编辑</button><button class="button" id="announcement-reload" type="button">刷新公告</button></div>
<p id="announcement-status" role="status"></p></form><div id="admin-announcements-list" class="announcements-list"></div></section>
<h2 class="admin-accounts-title">账号管理</h2><div class="card admin-table"><table><thead><tr><th>账号</th><th>注册时间</th><th>角色 / 状态</th><th>操作</th></tr></thead><tbody id="admin-users"></tbody></table></div></section></main></body></html>
