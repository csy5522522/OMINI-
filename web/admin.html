<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omini 管理员后台</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body><main class="admin-shell"><a href="/">← 返回工具箱</a><h1>管理员后台</h1><p class="muted">账号管理 · 密码重置 · 登录状态管理</p><form id="admin-login" class="card admin-login"><label for="admin-name">管理员账号</label><input id="admin-name" autocomplete="username" value="admin" required><label for="admin-password">密码</label><input id="admin-password" type="password" autocomplete="current-password" required><button class="button primary">登录后台</button></form><p id="admin-status" role="status"></p><section id="admin-panel" hidden><div class="memo-toolbar"><button class="button" id="admin-reload">刷新账号</button><button class="button" id="admin-change">修改管理员密码</button><button class="button" id="admin-logout">退出登录</button></div><p class="muted">服务端保存加盐密码哈希；后台通过重置密码帮助用户恢复访问。</p><div class="card admin-table"><table><thead><tr><th>账号</th><th>注册时间</th><th>角色 / 状态</th><th>操作</th></tr></thead><tbody id="admin-users"></tbody></table></div></section></main></body></html>
